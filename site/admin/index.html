</style></head><body><header><div><div class="logo">大仏BASE</div><div class="small">WORLD BUDDHA DATABASE · 管理画面</div></div><div class="small">265件の既存レコードを搭載した管理画面プレビュー</div></header><main class="wrap"><div class="banner"><b>公開サイトとは未接続です。</b> ここでの変更はこのブラウザ内の保存領域に記録されます。別の端末・ブラウザでの共有や公開サイトへの反映はできません。必ず「JSON書き出し」でバックアップしてください。</div><div class="top"><div><h1>仏像データ管理</h1><div class="small">追加・編集・非公開・掲載順を一元管理</div></div><div class="stats"><div class="stat"><span>登録</span><b id="total">265</b></div><div class="stat"><span>公開</span><b id="published">265</b></div><div class="stat"><span>先頭固定</span><b id="featured">0</b></div></div></div><div class="controls"><input id="search" placeholder="仏像名・都道府県・国・寺院で検索"/><select id="filter"><option value="all">全件を表示</option><option value="published">公開中</option><option value="draft">非公開</option><option value="featured">先頭固定</option></select><select id="sort"><option value="display">掲載順</option><option value="name">名前順</option><option value="size">像高・全長の大きい順</option></select><button id="new" class="primary">＋ 仏像を新規追加</button></div><div class="buttonrow" style="margin-bottom:14px"><button id="save">変更を保存</button><button id="export">JSON書き出し</button><button id="import">JSON読み込み</button><button id="csv">CSV書き出し</button><button id="reset" class="danger">初期データに戻す</button><input id="file" type="file" accept=".json,application/json" class="file"></div><div id="status" class="status" aria-live="polite"></div><div class="layout"><section class="pane"><h2>掲載一覧 <span id="visibleCount" class="small"></span></h2><div class="scroll" id="rows"></div></section><section class="pane"><h2 id="editTitle">仏像の編集</h2><div class="form" id="editor"><div class="empty">左側の一覧から仏像を選ぶか「新規追加」を押してください。</div></div></section></div></main><script>
const initial=[{"id":"buddha-001","name":"牛久大仏","name_en":"","country":"日本","location":"茨城県・牛久市","pose":"立像","category":"如来","description":"牛久大仏は、茨城県牛久市に立つ阿弥陀如来像。親鸞ゆかりの常陸の地に造られた、現代の大仏です。像そのものの高さ100mに台座20mを加え、地上からの総高は120mになります。\n\n1993年に完成。内部の構造と外側の青銅の外装を組み合わせた建築でもあり、古い鋳造大仏とは異なる造立技術で巨大な仏の姿を支えています。\n\n見どころは、地上から見上げる立ち姿と、内部から体感する大きさの違い。胎内の展示や浄土を表す空間、周囲の庭園も含めて、阿弥陀如来への信仰を伝える施設です。","color":"#a9b8a2","sources":[{"url":"https://daibutu.net/daibutu.html","kind":"official_or_heritage"},{"url":"https://www.kawada.co.jp/sekoujisseki/tokyohonganji_ushiku.html","kind":"official_or_heritage"},{"url":"https://ppap.kinto-jp.com/articles/nihonichi-daibutsu","kind":"reference"},{"url":"https://daibutu.net/","kind":"official_or_heritage"}],"height_statue_m":100,"height_total_m":120,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://daibutu.net/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1993年（完成）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://daibutu.net/daibutu.html"},"summary":"像高100m。近代の技術で阿弥陀如来の世界を表した青銅の立像。","material":"青銅（外装）","japan_master_id":"JPW-0017","deity":"阿弥陀如来","families":["仏・如来"],"deity_names":[{"name":"阿弥陀如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"candidate_found","commons_file_page":"https://commons.wikimedia.org/wiki/File:Ushiku_Daibutsu_-_Great_Buddha_in_Japan.jpg","photo_author":"Manish Prabhune","photo_license":"CC BY 4.0","license_url":"https://creativecommons.org/licenses/by/4.0/","publication_status":"not_published","rights_review":"彫刻自体の権利要確認（現代の屋外像）","representation_scope":"単独像","publication_review":"保留（被写体の権利確認）"},"display_order":1,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-002","name":"鎌倉大仏","name_en":"","country":"日本","location":"神奈川県・鎌倉市","pose":"坐像","category":"如来","description":"高徳院の本尊で、国宝の銅造阿弥陀如来坐像。像高11.312m、台座を含む高さ13.35mと、二つの寸法を分けて見る必要があります。\n\n1252年は現在の金銅仏の造立が始まった年です。完成年や作者は確定していません。勧進によって造られた像は、かつて大仏殿に収められていましたが、建物の災害・損壊を経て露坐の大仏となりました。\n\n均整のとれた体と穏やかな表情には、鎌倉彫刻と宋の仏像の影響が指摘されています。頬などに残る金箔の痕跡も、当初の金色の姿を想像させる手掛かりです。","color":"#a8c0b8","sources":[{"url":"https://www.kotoku-in.jp/about.html","kind":"official_or_heritage"},{"url":"https://www.kotoku-in.jp/characteristic.html","kind":"official_or_heritage"},{"url":"https://kotoku-in.jp/site/","kind":"official_or_heritage"}],"height_statue_m":11.312,"height_total_m":13.35,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://kotoku-in.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1252年（造立開始）","basis":"制作・建立の資料照合","note":"完成年ではなく、現在の金銅仏の造立開始年。作者・完成時期は確定していません。","source_url":"https://www.kotoku-in.jp/about.html"},"summary":"1252年に造立開始。鎌倉時代の姿を伝える高徳院の阿弥陀如来。","material":"銅造","japan_master_id":"JPW-0043","deity":"阿弥陀如来","families":["仏・如来"],"deity_names":[{"name":"阿弥陀如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"candidate_found","commons_file_page":"https://commons.wikimedia.org/wiki/File:The_Great_Buddha_of_Kamakura.jpg","photo_author":"Alexandar Vujadinovic","photo_license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0/","publication_status":"not_published","rights_review":"写真とは別の施設・被写体条件を点検","representation_scope":"単独像","publication_review":"候補（クレジット・施設条件最終確認）"},"display_order":2,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-003","name":"奈良の大仏","name_en":"","country":"日本","location":"奈良県・奈良市","pose":"坐像","category":"如来","description":"東大寺大仏殿の本尊、盧舎那仏坐像です。聖武天皇の発願による造立事業の中心となり、752年に開眼供養が行われました。華厳の教えにおける盧舎那仏を表しています。\n\n大仏は戦乱による損傷と修理・再興を繰り返しており、現在の全身が創建時のまま残っているわけではありません。大仏殿の建物が再建された年と、仏像が開眼した年も別です。\n\n寺院公表の像高は14.98m、総高は18.03m。蓮華座や光背、両脇の菩薩像まで視線を広げると、巨大な本尊を中心に構成された堂内の世界が分かります。","color":"#c3ac89","sources":[{"url":"https://www.todaiji.or.jp/information/daibutsuden/","kind":"official_or_heritage"},{"url":"https://www.todaiji.or.jp/","kind":"official_or_heritage"}],"height_statue_m":14.98,"height_total_m":18.03,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.todaiji.or.jp/information/daibutsuden/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"752年（開眼）","basis":"制作・建立の資料照合","note":"752年は開眼供養の年。後世の修理・再興を含む現状の仏像です。","source_url":"https://www.todaiji.or.jp/information/daibutsuden/"},"summary":"752年に開眼。修理と再興を重ねて受け継がれてきた東大寺の盧舎那仏。","material":"銅造","japan_master_id":"JPW-0100","deity":"盧舎那仏","families":["仏・如来"],"deity_names":[{"name":"盧舎那仏","language":"ja"}],"traditions":["大乗仏教"],"schools":["華厳宗"],"classification_note":"","tradition_scope":"安置寺院の現在の伝統・宗派","field_sources":{"traditions":{"url":"https://www.todaiji.or.jp/","checked_at":"2026-11-08"}},"revision":0,"photo_research":{"status":"candidate_found","commons_file_page":"https://commons.wikimedia.org/wiki/File:Great_Buddha_at_Todaiji,_Nara.jpg","photo_author":"Manish Prabhune","photo_license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0/","publication_status":"not_published","rights_review":"写真とは別の施設・被写体条件を点検","representation_scope":"単独像","publication_review":"候補（クレジット・施設条件最終確認）"},"display_order":3,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-004","name":"越前大仏","name_en":"","country":"日本","location":"福井県・勝山市","pose":"坐像","category":"如来","description":"福井県勝山市の大師山清大寺に安置される毘盧遮那如来坐像。実業家・多田清の発願で造られ、1987年に開眼しました。\n\n中国・龍門石窟の奉先寺にある仏像を手本とする造形で、像高は17m。堂内の脇侍や多数の小仏と組み合わせ、巨大な本尊を中心とする仏の世界を表しています。\n\n比較するときは「坐像」「像本体の高さ」という条件をそろえることが大切です。屋外の立像や、台座を加えた総高の記録と、そのまま順位を比べることはできません。","color": ,"longitude":null,"official_url":"https://www.city.takaoka.toyama.jp/soshiki/kyoikuiinkai_chuotoshokan/2/1/2/shousai/11987.html","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1933年（現在像完成）","basis":"制作・建立の資料照合","note":"初代木像ではなく、現在の青銅像の完成年。","source_url":"https://www.city.takaoka.toyama.jp/soshiki/kyoikuiinkai_chuotoshokan/2/1/2/shousai/11987.html"},"official_info":{"url":"https://www.takaoka.or.jp/viewpoint/detail_3204.html","label":"自治体・観光協会の公式情報"},"summary":"二度の火災を経て1933年に再興。高岡の鋳物技術が支える阿弥陀如来。","material":"青銅","dimension_note":"15.85mは地上から光背頂部まで。像本体7.43mとは測定範囲が異なります。","japan_master_id":"JPW-0046","deity":"阿弥陀如来","families":["仏・如来"],"deity_names":[{"name":"阿弥陀如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"candidate_found","commons_file_page":"https://commons.wikimedia.org/wiki/File:Takaoka_Daibutsu_8.jpg","photo_author":"Zairon","photo_license":"CC BY-SA 4.0","license_url":"https://creativecommons.org/licenses/by-sa/4.0/","publication_status":"not_published","rights_review":"写真とは別の施設・被写体条件を点検","representation_scope":"単独像","publication_review":"候補（クレジット・施設条件最終確認）"},"display_order":5,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-006","name":"岐阜大仏","name_en":"","country":"日本","location":"岐阜県・岐阜市","pose":"坐像","category":"如来","description":"岐阜大仏は、正法寺に安置される釈迦如来坐像です。寺院が公表する高さは13.7m。青銅を鋳込む大仏とは異なり、木の骨組みに竹を編み、紙や漆、金箔を重ねて造られています。\n\n災害や飢饉による犠牲者の供養などを願って造立が進められ、1832年に開眼しました。大規模な像を軽い材料の組み合わせで実現した点に、工法上の大きな特徴があります。\n\n黄金色の表面だけでなく、その下の構造を知ってから眺めると見え方が変わります。堂内に収まる柔らかな表情と、巨大な像を支える竹や紙の仕事を想像してみてください。","color":"#c5b28c","sources":[{"url":"https://gifu-daibutsu.com/","kind":"official_or_heritage"},{"url":"https://gifu-daibutsu.com/wp/?page_id=148","kind":"official_or_heritage"},{"url":"https://www.kankou-gifu.jp/spot/detail_918.html","kind":"official_or_heritage"}],"height_s _author":"FrancoOcampo11","photo_license":"CC0 1.0","license_url":"https://creativecommons.org/publicdomain/zero/1.0/","publication_status":"not_published","rights_review":"彫刻自体の権利要確認（現代の屋外像）","representation_scope":"単独像","publication_review":"保留（被写体の権利確認）"},"display_order":19,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-020","name":"高崎白衣大観音","name_en":"Takasaki Byakue Daikannon","country":"日本","location":"群馬県高崎市","pose":"立像","category":"菩薩","description":"高崎白衣大観音は、群馬県高崎市の慈眼院にある観音菩薩の立像。実業家・井上保三郎の発願によって造られ、1936年に開眼しました。\n\n高さ41.8mの鉄筋コンクリート造で、白い衣の表現が穏やかな輪郭をつくっています。近代の材料で巨大な宗教彫刻を築いた事例としても見ることができます。\n\n観音菩薩は如来と同じ分類ではありません。「誰を表すか」と「どんな姿か」を分けると、この像は観音菩薩・立像・鉄筋コンクリート造として整理できます。","color":"#b1b9a5","sources":[{"url":"https://www.city.takasaki.gunma.jp/site/cultural-assets/3526.html","kind":"official_or_heritage"},{"url":"https://en.wikipedia.org/wiki/Takasaki_Byakue_Daikannon","kind":"encyclopedia"},{"url":"https://takasakikannon.or.jp/","kind":"official_or_heritage"}],"height_statue_m":41.8,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://takasakikannon.or.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1936年（開眼）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.city.takasaki.gunma.jp/site/cultural-assets/3526.html"},"official_info":{"url":"https://www.city.takasaki.gunma.jp/site/sightseeing/3527.html","label":"自治体・観光協会の公式情報"},"summary":"実業家の発願で1936年に開眼した、高崎の白衣観音。","material":"鉄筋コンクリート","japan_master_id":"JPA-0001","deity":"白衣観音菩薩","families":["菩薩"],"deity_names":[{"name":"白衣観音菩薩","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":20,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-021","name":"大船観音","name_en":"Ōfuna Kannon","country":"日本","location":"神奈川県鎌倉市","pose":"胸像","category":"菩薩","description":"大船観音寺の白衣観音像は、頭部と上半身を表す胸像です。地面に埋まった全身立像ではなく、はじめから胸像として造られた点が特徴です。\n\n1929年に造立が始まりましたが、戦争の影響で工事が中断。戦後に再開され、1960年に完成しました。造立開始と完成の間に長い時間があるため、二つの年代を区別しています。\n\n白い面と緩やかな衣の線、少しうつむく顔が一体となって、近くからも遠くからも印象的な姿をつくります。高さの比較では、全身像と胸像を同条件で扱わないよう注意が必要です。","color":"#b1b9a5","sources":[{"url":"https://www.trip-kamakura.com/facility/detail.php?id=13","kind":"official_or_heritage"},{"url":"https://en.wikipedia.org/wiki/%C5%8Cfuna_Kannon","kind":"encyclopedia"},{"url":"https://oofuna-kannon.or.jp/","kind":"official_or_heritage"}],"height_statue_m":25.39,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://oofuna-kannon.or.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1929年着工・1960年完成","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.trip-kamakura.com/facility/detail.php?id=13"},"summary":"戦争による中断を経て1960年に完成。胸像として造られた白衣観音。","material":"鉄筋コンクリート","japan_master_id":"JPA-0006","deity":"白衣観音菩薩","families":["菩薩"],"deity_names":[{"name":"白衣観音菩薩","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"candidate_found","commons_file_page":"https://commons.wikimedia.org/wiki/File:Ofuna-Kannon.jpg","photo_author":"Urashimataro","photo_license":"Public domain (PD-self)","license_url":"https://commons.wikimedia.org/wiki/Commons:Licensing","publication_status":"not_published","rights_review":"彫刻自体の権利要確認（現代の屋外像）","representation_scope":"単独像","publication_review":"保留（被写体の権利確認）"},"display_order":21,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-022","name":"北海道大観音","name_en":"Dai Kannon of Kita no Miyako park","country":"日本","location":"北海道芦別市","pose":"立像","category":"菩薩","description":"北海道大観音は、北海道芦別市に立つ巨大な観音像です。市の年表には、1989年に北海道大観音が完成したことが記録されています。\n\n周辺の大型観光施設とともに知られるようになった像で、古い寺院の創建時から伝わる仏像とは成立の背景が異なります。巨大な宗教彫刻と地域の観光開発が関わった事例です。\n\n遠景では輪郭、近くでは顔や衣の表現に目を向けると、巨像ならではの造形が分かります。施設の運営状況と像の歴史は別の情報なので、訪問時の公開条件は最新の案内で確認してください。","color":"#b1b9a5","sources":[{"url":"https://www.city.ashibetsu.hokkaido.jp/docs/5024.html","kind":"official_or_heritage"},{"url":"https://en.wikipedia.org/wiki/Dai_Kannon_of_Kita_no_Miyako_park","kind":"encyclopedia"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":null,"admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1989年（完成）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.city.ashibetsu.hokkaido.jp/docs/5024.html"},"summary":"芦別に1989年完成。北海道の近代観光史とも関わる大観音。","deity":"観音菩薩","families":["菩薩"],"deity_names":[{"name":"観音菩薩","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":22,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-023","name":"救世慈母大観音","name_en":"Naritasan Kurume Bunin","country":"日本","location":"福岡県久留米市","pose":"立像","category":"菩薩","description":"救世慈母大観音は、福岡県久留米市の成田山久留米分院にある観音像です。寺院の発信では高さ62mと案内され、地域の大きな目印となっています。\n\n成田山久留米分院の本尊は不動明王であり、この巨大な観音像そのものを寺院の本尊と混同しないことが大切です。また、境内にある平和大仏塔も観音像とは別の建造物です。\n\n大仏巡りでは、同じ境内の複数の像や塔の名前・高さが混ざりやすくなります。ここでは「救世慈母大観音」という一体の観音像を対象とし、塔の寸法や由来とは分けて紹介しています。","color":"#b1b9a5","sources":[{"url":"https://readyfor.jp/projects/kurume-naritasan","kind":"official_or_heritage"},{"url":"https://en.wikipedia.org/wiki/Naritasan_Kurume_Bunin","kind":"encyclopedia"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":null,"admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":null,"summary":"久留米成田山の救世慈母観音。高さ62mの観音像と大仏塔は別の建造物。","deity":"救世慈母観音菩薩","families":["菩薩"],"deity_names":[{"name":"救世慈母観音菩薩","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":23,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-024","name":"日本寺大仏","name_en":"Nihon-ji","country":"日本","location":"千葉県鋸南町","pose":"坐像","category":"如来","description":"日本寺大仏は、鋸山の岩を彫って造られた薬師瑠璃光如来です。独立した石材を組む像ではなく、地山の岩とつながる磨崖仏として見ることができます。\n\n1783年に大野甚五郎英令と門弟たちが造立した像は、その後風化や損傷を受けました。現在の姿には昭和期の修復が反映されており、江戸時代の造立年を現在の全ての部分の制作年と考えることはできません。\n\n見どころは、薬師如来の姿と、それを取り囲む岩の面の連続性です。同じ境内の百尺観音とは別の像なので、名称や高さ、造立の背景を取り違えないようにしましょう。","color":"#b1b9a5","sources":[{"url":"https://www.nihonji.jp/","kind":"official_or_heritage"},{"url":"https://www.nihonji.jp/境内案内/大仏広場/","kind":"official_or_heritage"},{"url":"https://en.wikipedia.org/wiki/Nihon-ji","kind":"encyclopedia"}],"height_statue_m":31.0,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.nihonji.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1783年（当初造立）","basis":"制作・建立の資料照合","note":"現在の姿には後世の修復を含みます。","source_url":"https://www.nihonji.jp/境内案内/大仏広場/"},"summary":"岩山から彫り出された薬師如来。江戸時代の造立と昭和の修復を分けて知る。","material":"岩石（磨崖仏）","japan_master_id":"JPW-0028","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"薬師瑠璃光如来","families":["仏・如来"],"deity_names":[{"name":"薬師瑠璃光如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"candidate_found","commons_file_page":"https://commons.wikimedia.org/wiki/File:Nihonji_daibutsu.jpg","photo_author":"Emily Zarndt","photo_license":"CC BY-SA 3.0","license_url":"https://creativecommons.org/licenses/by-sa/3.0/","publication_status":"not_published","rights_review":"写真とは別の施設・被写体条件を点検","representation_scope":"単独像","publication_review":"候補（クレジット・施設条件最終確認）"},"display_order":24,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-025","name":"飛鳥大仏","name_en":"Asuka-dera","country":"日本","location":"奈良県明日香村","pose":"坐像","category":"如来","description":"飛鳥大仏は、奈良県明日香村の飛鳥寺に安置される釈迦如来像です。飛鳥時代にさかのぼる由緒を持ち、仏教が日本に定着していく時代を考えるうえで重要な像です。\n\n長い歴史の中で火災や補修を経験しており、現在の姿には後世に補われた部分もあります。「古い仏像」という説明にとどまらず、残された部分と修理の歴史をあわせて知ることで理解が深まります。\n\n細長い顔立ちや正面を意識した姿など、初期仏像の表現を鑑賞できるのが見どころ。奈良時代の東大寺大仏や中世の鎌倉大仏と比べると、時代による表現の違いが見えてきます。","color":"#b1b9a5","sources":[{"url":"https://www.visitnara.jp/lists-and-stories/list/naras-best-buddhist-statuary/","kind":"official_or_heritage"},{"url":"https://en.wikipedia.org/wiki/Asuka-dera","kind":"encyclopedia"},{"url":"https://yamatoji.nara-kankou.or.jp/01shaji/02tera/03east_area/asukadera/","kind":"official_or_heritage"}],"height_statue_m":2.75,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://yamatoji.nara-kankou.or.jp/01shaji/02tera/03east_area/asukadera/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"飛鳥時代","basis":"制作・建立の資料照合","no "photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":26,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-027","name":"兵庫大仏","name_en":"Hyōgo Daibutsu","country":"日本","location":"兵庫県神戸市","pose":"坐像","category":"如来","description":"兵庫大仏は、神戸市の能福寺にある大仏です。1891年に建立された初代は、1944年に戦時の金属供出で失われました。現在の像は1991年に再興されたものです。\n\n神戸市の案内では像本体11m、蓮台3m、台座4mで、合計18mとされています。像高と、足元の構造を含む総高の違いがよく分かる例です。\n\n初代が生まれた近代の港町の歴史と、戦争による喪失、戦後の再興を重ねて見ることができます。大きさに加え、地域が像を造り直して受け継いできた経緯も重要な見どころです。","color":"#b1b9a5","sources":[{"url":"https://nofukuji.jp/","kind":"official_or_heritage"},{"url":"https://www.city.kobe.lg.jp/e90232/kuyakusho/hyogoku/shoukai/rekishi/history_6.html","kind":"official_or_heritage"},{"url":"https://en.wikipedia.org/wiki/Hy%C5%8Dgo_Daibutsu","kind":"encyclopedia"}],"height_statue_m":11,"height_total_m":18,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://nofukuji.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1891年（初代）・1991年（再興）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.city.kobe.lg.jp/e90232/kuyakusho/hyogoku/shoukai/rekishi/history_6.html"},"summary":"戦時中に失われた初代から、1991年に再興された能福寺の大仏。","material":"金属造","japan_master_id":"JPW-0094","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"毘盧遮那仏","families":["仏・如来"],"deity_names":[{"name":"毘盧遮那仏","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":27,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-028","name":"昭和大仏","name_en":"Shōwa Daibutsu","country":"日本","location":"青森県青森市","pose":"坐像","category":"如来","description":"昭和大仏は、青森市の青龍寺に安置される大日如来坐像です。1984年に建立された青銅の大仏で、釈迦如来や阿弥陀如来とは異なる仏を表しています。\n\n青森県の観光案内では像高21.35m、台座を含む高さ27mと紹介されています。坐像の大きさを比べる際には、台座を含めるかどうかをそろえる必要があります。\n\n如来でありながら装身具を身に着ける大日如来の姿は、他の大仏との比較に向いています。手の組み方や頭部の飾りに目を向けると、尊格による表現の違いが分かります。","color":"#b1b9a5","sources":[{"url":"https://aomori-tourism.com/spot/detail_11.html","kind":"official_or_heritage"},{"url":"https://en.wikipedia.org/wiki/Sh%C5%8Dwa_Daibutsu","kind":"encyclopedia"}],"height_statue_m":21.35,"height_total_m":27,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://aomori-tourism.com/spot/detail_11.html","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1984年（建立）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://aomori-tourism.com/spot/detail_11.html"},"summary":"青森・青龍寺の大日如来坐像。1984年建立の青銅大仏。","material":"青銅","japan_master_id":"JPW-0004","official_info":{"url":"https://aomori-tourism.com/spot/detail_11.html","label":"自治体・観光協会の公式情報"},"deity":"大日如来","families":["仏・如来"],"deity_names":[{"name":"大日如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":28,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-029","name":"福岡大仏","name_en":"Tōchō-ji","country":"日本","location":"福岡県福岡市","pose":"坐像","category":"如来","description":"福岡大仏は、福岡市の東長寺に安置される木造釈迦如来坐像です。1988年に制作が始まり、4年をかけて1992年に完成した大仏と案内されています。\n\n像高10.8m、重さ30tの木造像で、古い寺院に現代の大仏を迎えた例です。寺院の創建伝承と、現在の仏像が造られた年は分けて理解する必要があります。\n\n見どころは、木で形づくられた大きな体と堂内で感じる距離感です。青銅や石の大仏と比べながら、素材による表面の印象や造形の違いを味わえます。","color":"#b1b9a5","sources":[{"url":"https://www.tochoji.net/","kind":"official_or_heritage"},{"url":"https://yokanavi.com/features/120994","kind":"official_or_heritage"},{"url":"https://en.wikipedia.org/wiki/T%C5%8Dch%C5%8D-ji","kind":"encyclopedia"},{"url":"https://yokanavi.com/spots/26928","kind":"official_or_heritage"},{"url":"https://www.crossroadfukuoka.jp/spot/12556","kind":"official_or_heritage"}],"height_statue_m":10.8,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.tochoji.net/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["description","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1992年（完成）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://yokanavi.com/features/120994"},"summary":"東長寺の木造釈迦如来。現代に造られた、像高10.8mの大仏。","material":"木造","japan_master_id":"JPW-0115","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"釈迦如来","families":["仏・如来"],"deity_names":[{"name":"釈迦如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":29,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-030","name":"頭大仏","name_en":"Hill of the Buddha","country":"日本","location":"北海道札幌市","pose":"坐像","category":"仏像","description":"頭大仏は、札幌の真駒内滝野霊園にある大仏を、丘のような建築と景観で包んだ祈りの空間です。遠くからは頭部だけが見え、参道を進むと全身に向き合う構成になっています。\n\n現在の景観は安藤忠雄の設計で知られています。大仏そのものの制作と、後から整備された頭大仏の建築・ランドスケープは、同じ時期の事業ではありません。建築の年をそのまま仏像の建立年にはできません。\n\n見どころは、見え方が移動とともに変わること。遠景の頭部、参道からの接近、空へ開いた空間に座る全身という順に、仏像と建築の関係を体験できます。","color": raditions":["上座部仏教"],"schools":[],"classification_note":"","tradition_scope":"安置寺院の現在の伝統・宗派","field_sources":{"traditions":{"url":"https://birminghambuddhistvihara.org/","checked_at":"2026-11-08"}},"revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":100,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-101","name":"興福寺 阿修羅像","name_en":"","country":"日本","location":"奈良県奈良市","pose":"立像","category":"天部","description":"興福寺の阿修羅像は、八部衆像の一体で、仏の教えを守る存在を表します。釈迦如来や観音菩薩とは異なる、天部に属する像です。\n\n734年に光明皇后が母・橘三千代の冥福を願って建てた西金堂に安置されていました。脱活乾漆造という、麻布と漆などを用いる技法で造られた奈良時代の作品です。\n\n三つの顔と六本の腕がつくる細やかな構成、激しい戦いの姿とは違う静かな表情が見どころです。巨大像ではありませんが、仏像の種類と日本彫刻の歴史を知る代表的な作品として掲載しています。","color":"#b6bcae","sources":[{"url":"https://www.kohfukuji.com/property/b-0008/","kind":"official_or_heritage"},{"url":"https://www.visitnara.jp/venues/A01040/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.kohfukuji.com/property/b-0008/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"734年（制作）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.kohfukuji.com/property/b-0008/"},"official_info":{"url":"https://www.visitnara.jp/venues/A01040/","label":"公式情報"},"summary":"三つの顔と六本の腕。734年の西金堂に由来する天平の守護像。","material":"脱活乾漆造","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"阿修羅","families":["天部・護法尊"],"deity_names":[{"name":"阿修羅","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":101,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-102","name":"興福寺 東金堂の薬師如来像","name_en":"","country":"日本","location":"奈良県奈良市","pose":"坐像","category":"如来","description":"興福寺東金堂の本尊で、病苦からの救いを願う薬師如来を表した像です。薬師如来を中心に、脇侍や十二神将などを配する堂内全体が一つの信仰の場となっています。\n\n現在の銅造像は1415年の造立です。東金堂は歴史の中で繰り返し火災に遭っています。古代の薬師如来像に由来する信仰と、火災後に造り直された現在の本尊を区別して見ることが大切です。\n\n国宝館の「銅造仏頭」は別の展示対象であり、現在の東金堂本尊と同じ一体として扱うことはできません。堂の創建、旧本尊、現本尊という複数の歴史が重なる点が、この像を知る手掛かりになります。","color":"#b6bcae","sources":[{"url":"https://www.kohfukuji.com/property/b-0057/","kind":"official_or_heritage"},{"url":"https://www.kohfukuji.com/about/history/","kind":"official_or_heritage"},{"url":"https://visitnara.jp/venues/A00486/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.kohfukuji.com/property/b-0057/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"1415年（現在像の造立）","basis":"公式資料の制作年代","note":"寺院の創建や建物の再建年代と、仏像の制作年代を区別しています。","source_url":"https://www.kohfukuji.com/property/b-0057/"},"official_info":{"url":"https://visitnara.jp/venues/A00486/","label":"公式情報"},"summary":"東金堂の本尊。古代からの信仰と、火災後の再興の歴史を伝える薬師如来。","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"薬師如来","families":["仏・如来"],"deity_names":[{"name":"薬師如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":102,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-103","name":"中宮寺 菩薩半跏像","name_en":"","country":"日本","location":"奈良県斑鳩町","pose":"半跏像","category":"菩薩","description":"中宮寺の本尊は、国宝の菩薩半跏像です。寺伝では如意輪観音とされています。半跏思惟という姿だけで、一律に弥勒菩薩と決めることはできません。\n\n飛鳥時代を代表する木彫で、片足をもう一方の脚に載せ、指を頬へ寄せて考えるような姿をとります。左右の脚の形と手の動きが、静かなまとまりをつくっています。\n\n穏やかな微笑、緩やかな体の線、思索する姿勢が見どころです。像の呼称や伝承を知ったうえで、広隆寺の半跏思惟像と表情や姿勢を比べると、それぞれの特徴が分かります。","color":"#b6bcae","sources":[{"url":"https://www.chuguji.jp/","kind":"official_or_heritage"},{"url":"https://www.chuguji.jp/archaic-smile/","kind":"official_or_heritage"},{"url":"https://visitnara.jp/venues/A00507/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.chuguji.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"飛鳥時代","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.chuguji.jp/archaic-smile/"},"official_info":{"url":"https://visitnara.jp/venues/A00507/","label":"公式情報"},"summary":"頬に手を寄せて思索する、飛鳥時代の菩薩半跏像。","material":"木造","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"菩薩（寺伝・如意輪観音）","families":["菩薩"],"deity_names":[{"name":"菩薩（寺伝・如意輪観音）","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":103,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-104","name":"法隆寺 金堂の釈迦三尊像","name_en":"","country":"日本","location":"奈良県斑鳩町","pose":"複数の姿","category":"如来・菩薩","description":"法隆寺金堂の釈迦三尊像は、中央の釈迦如来と両脇侍からなる国宝です。飛鳥彫刻を代表する金銅仏で、光背背面の銘文が造像の由来を伝えています。\n\n寺院の解説では623年の完成とされています。仏像の背に記された文字は、姿の美しさだけでなく、造立を願った人々や時代との関係を考える重要な資料です。\n\n正面性の強い体、左右に広がる衣の表現、三尊を包む大きな光背が特徴です。単独の如来像としてだけでなく、脇侍と光背を含む一まとまりの構成として眺めてみてください。","color":"#b6bcae","sources":[{"url":"https://www.horyuji.or.jp/garan/kondo/detail/","kind":"official_or_heritage"},{"url":"https://www.horyuji.or.jp/en/garan/kondo/detail/","kind":"official_or_heritage"},{"url":"https://www.visitnara.jp/venues/A00506/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.horyuji.or.jp/garan/kondo/detail/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"623年（完成）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.horyuji.or.jp/en/garan/kondo/detail/"},"official_info":{"url":"https://www.visitnara.jp/venues/A00506/","label":"公式情報"},"summary":"光背銘が造像の由来を伝える、623年完成の釈迦三尊像。","material":"銅造（鍍金）","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"釈迦如来・両脇侍菩薩","families":["仏・如来","菩薩"],"deity_names":[{"name":"釈迦如来・両脇侍菩薩","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":104,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-105","name":"法隆寺 大講堂の薬師如来像","name_en":"","country":"日本","location":"奈良県斑鳩町","pose":"坐像","category":"如来","description":"法隆寺大講堂に安置される薬師如来は、両脇侍とともに薬師三尊を構成する本尊です。金堂にも薬師如来像がありますが、こちらは大講堂の像を対象にしています。\n\n寺院の解説では、990年の大講堂再建時に新たに造られました。同じ寺院に同じ尊名の像がある場合、堂名を付けることで歴史や素材、制作年代の取り違えを防げます。法隆寺の諸堂を巡る際には、建物と本尊を一組として確認すると整理しやすくなります。\n\n中央に座る如来と脇侍との配置、光背と台座を含めた構成に注目できます。金堂の飛鳥仏と見比べながら、表情や体つき、衣の表現の違いを探せる像です。","color":"#b6bcae","sources":[{"url":"https://www.horyuji.or.jp/garan/daikodo/","kind":"official_or_heritage"},{"url":"https://www.horyuji.or.jp/garan/daikodo/","kind":"official_or_heritage"},{"url":"https://www.visitnara.jp/venues/A00506/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.horyuji.or.jp/garan/daikodo/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"990年（大講堂再建時の造像）","basis":"公式資料の制作年代","note":"寺院の創建や建物の再建年代と、仏像の制作年代を区別しています。","source_url":"https://www.horyuji.or.jp/garan/daikodo/"},"official_info":{"url":"https://www.visitnara.jp/venues/A00506/","label":"公式情報"},"summary":"法隆寺大講堂の本尊。金堂の薬師如来と区別したい薬師三尊。","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"薬師如来","families":["仏・如来"],"deity_names":[{"name":"薬師如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":105,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-106","name":"新薬師寺 薬師如来像","name_en":"","country":"日本","location":"奈良県奈良市","pose":"坐像","category":"如来","description":"新薬師寺本堂の中央に安置される国宝の薬師如来坐像です。薬師如来は、病苦を除くことなどの願いを立てた仏として信仰されています。\n\n1975年の調査では、像の体内から平安初期の法華経八巻が発見されました。仏像は外から見る彫刻であるとともに、内部に経典などを納める信仰の器でもあることを伝えます。\n\n本尊を囲む十二神将とあわせて鑑賞すると、守護する像と守られる仏の関係が分かります。静かな如来の表情と、周囲の動きの大きい神将たちとの対比も見どころです。","color":"#b6bcae","sources":[{"url":"https://www.shinyakushiji.or.jp/yakusinyorai/","kind":"official_or_heritage"},{"url":"https://www.visitnara.jp/buddhist-statues/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.shinyakushiji.or.jp/yakusinyorai/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"平安時代初期","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.shinyakushiji.or.jp/yakusinyorai/"},"official_info":{"url":"https://www.visitnara.jp/buddhist-statues/","label":"公式情報"},"summary":"十二神将に囲まれる本尊。体内から経巻が見つかった新薬師寺の薬師如来。","material":"木造","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"薬師如来","families":["仏・如来"],"deity_names":[{"name":"薬師如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":106,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-107","name":"新薬師寺 十二神将像","name_en":"","country":"日本","location":"奈良県奈良市","pose":"立像","category":"天部","description":"新薬師寺の十二神将は、中央の薬師如来を守る十二の武神を表した像群です。円形の壇上に立ち、仏の世界と信仰する人々を守る役割を担います。\n\n奈良時代の塑像が中心で、現在は部分的に当初の彩色も残っています。ただし十二体全てが同時代の国宝ではなく、寺伝で波夷羅大将と呼ばれる一体は後世の補作です。\n\n怒りの表情、腕や脚の動き、甲冑や衣の形に一体ずつ違いがあります。薬師如来の静けさと対照させながら、群像全体の配置と個々の表現を両方見るのがおすすめです。","color":"#b6bcae","sources":[{"url":"https://www.shinyakushiji.or.jp/junisinsho/","kind":"official_or_heritage"},{"url":"https://www.visitnara.jp/lists-and-stories/list/amp/naras-best-buddhist-statuary/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.shinyakushiji.or.jp/junisinsho/","admission":null,"opening_hours":null,"images":[],"record_type":"statue_group","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"奈良時代（主要像）・後世の補作あり","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.shinyakushiji.or.jp/junisinsho/"},"official_info":{"url":"https://www.visitnara.jp/lists-and-stories/list/amp/naras-best-buddhist-statuary/","label":"公式情報"},"summary":"薬師如来を囲む守護神の群像。奈良時代の塑像と後世の補作を含みます。","material":"塑造（主要像）","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"十二神将","families":["天部・護法尊"],"deity_names":[{"name":"十二神将","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":107,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-108","name":"室生寺 金堂の釈迦如来立像","name_en":"","country":"日本","location":"奈良県宇陀市","pose":"立像","category":"如来","description":"室生寺金堂の中央に立つ国宝の釈迦如来立像です。寺院の解説では、榧の一木像で、平安前期を代表する作品とされています。\n\n光背の図像などから、当初は薬師如来として造られた可能性も指摘されています。現在の尊名と、造立当初についての研究上の見解を区別して理解することが大切です。\n\n均整のとれた立ち姿に加え、衣に刻まれた波のような線が見どころです。室生寺には釈迦如来の坐像もあるため、ここでは「金堂の立像」として区別しています。","color":"#b6bcae","sources":[{"url":"https://www.murouji.or.jp/","kind":"official_or_heritage"},{"url":"https://www.murouji.or.jp/treasure/kondou/","kind":"official_or_heritage"},{"url":"https://www.visitnara.jp/buddhist-statues/","kind":"official_or_heritage"},{"url":"https://inori.nara-kankou.or.jp/inori/special/23butsuzou/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.murouji.or.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"平安時代前期","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.murouji.or.jp/treasure/kondou/"},"official_info":{"url":"https://www.visitnara.jp/buddhist-statues/","label":"公式情報"},"summary":"室生寺金堂の本尊。榧の一木から生まれた平安前期の釈迦如来立像。","material":"木造（榧・一木造）","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"釈迦如来","families":["仏・如来"],"deity_names":[{"name":"釈迦如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":108,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-109","name":"海龍王寺 十一面観音像","name_en":"","country":"日本","location":"奈良県奈良市","pose":"立像","category":"菩薩","description":"海龍王寺の十一面観音像は、頭上に複数の顔を表す観音菩薩の像です。人々を救う観音の働きを、多面的な姿で示しています。\n\n仏像を分類するときは、十一面という姿の特徴と、立像・坐像という姿勢を別に考えると整理できます。通常の観音像と同じく菩薩に属し、釈迦や薬師などの如来とは異なります。\n\n頭部に配された顔、宝冠、装身具、衣の細かな表現が見どころです。公開時期が限られる場合があるため、拝観の計画は寺院の最新案内で確認してください。","color":"#b6bcae","sources":[{"url":"https://kairyuouji.jp/","kind":"official_or_heritage"},{"url":"https://yamatoji88.jp/juichimenkannon_kairyuoji/","kind":"official_or_heritage"},{"url":"https://www.visitnara.jp/buddhist-statues/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://kairyuouji.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"鎌倉時代","basis":"公式資料の制作年代","note":"寺院の創建や建物の再建年代と、仏像の制作年代を区別しています。","source_url":"https://yamatoji88.jp/juichimenkannon_kairyuoji/"},"official_info":{"url":"https://www.visitnara.jp/buddhist-statues/","label":"公式情報"},"summary":"海龍王寺の十一面観音。頭上の顔や装身具に注目したい菩薩像。","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"十一面観音菩薩","families":["菩薩"],"deity_names":[{"name":"十一面観音菩薩","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":109,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-110","name":"薬師寺 薬師如来像","name_en":"","country":"日本","location":"奈良県奈良市","pose":"坐像","category":"如来","description":"薬師寺金堂の本尊は薬師如来で、日光菩薩・月光菩薩とともに薬師三尊を構成します。国宝に指定された、白鳳彫刻を代表する金属造の仏像です。\n\n現在の金堂は1976年に再建された建物ですが、本尊の制作年を1976年とすることはできません。古い仏像と近代に復興した堂が一緒に伝えられています。\n\n中央の如来の安定した坐り姿と、左右の菩薩の流れるような立ち姿が見どころ。三体を個別に見るだけでなく、全体の釣り合いや、台座の意匠にも目を向けると理解が深まります。","color":"#b6bcae","sources":[{"url":"https://yakushiji.or.jp/","kind":"official_or_heritage"},{"url":"https://yakushiji.or.jp/guide/garan_kondo.html","kind":"official_or_heritage"},{"url":"https://www.visitnara.jp/lists-and-stories/story/explore-naras-world-heritage-sites/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://yakushiji.or.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"白鳳時代（寺院の時代区分）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://yakushiji.or.jp/guide/garan_kondo.html"},"official_info":{"url":"https://www.visitnara.jp/lists-and-stories/story/explore-naras-world-heritage-sites/","label":"公式情報"},"summary":"日光・月光菩薩とともに並ぶ、薬師寺金堂の国宝・薬師三尊。","material":"金属造","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"薬師如来","families":["仏・如来"],"deity_names":[{"name":"薬師如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":110,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-111","name":"法輪寺 薬師如来像","name_en":"","country":"日本","location":"奈良県斑鳩町","pose":"坐像","category":"如来","description":"法輪寺の薬師如来像は、薬壺を持たない古い形式を伝える本尊です。寺伝には山背王一族のための造像という由来がありますが、伝承と制作をめぐる研究は区別して紹介する必要があります。\n\n面長の顔や直線的な体つきには、止利式の如来像の系譜がうかがえます。一方、重なる衣や二重まぶたなどには、中国の斉・周の様式の影響も指摘されています。\n\n薬師如来なら必ず薬壺を持つ、という見方では捉えきれない像です。持ち物だけで尊名を判断せず、伝承と造形をあわせて見ることの大切さが分かります。","color":"#b6bcae","sources":[{"url":"https://ikaruga-horinji.or.jp/","kind":"official_or_heritage"},{"url":"https://ikaruga-horinji.or.jp/about/statue/","kind":"official_or_heritage"},{"url":"https://visitnara.jp/venues/A00939/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://ikaruga-horinji.or.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"飛鳥時代","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://ikaruga-horinji.or.jp/about/statue/"},"official_info":{"url":"https://visitnara.jp/venues/A00939/","label":"公式情報"},"summary":"薬壺を持たない古い形式。飛鳥の造形を伝える法輪寺の薬師如来。","material":"木造","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"薬師如来","families":["仏・如来"],"deity_names":[{"name":"薬師如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":111,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-112","name":"三十三間堂 千手観音坐像","name_en":"","country":"日本","location":"京都府京都市","pose":"坐像","category":"菩薩","description":"三十三間堂の中央に安置される国宝の千手観音坐像です。周囲の千手観音立像群とは別の一体で、大きな本尊を中心とする堂内の構成をつくっています。\n\n千手観音は、多くの手によって人々を救う働きを表した観音菩薩です。実際の造形では多数の手を象徴的に表し、この本尊も複雑な腕と持ち物の構成を見せています。\n\n腕だけでなく、幾層にも重なる蓮華の台座や、透かし彫りを用いた光背も見どころです。中央の坐像と周囲の立像を区別すると、三十三間堂の仏像の配置が理解しやすくなります。","color":"#b6bcae","sources":[{"url":"https://www.sanjusangendo.jp/","kind":"official_or_heritage"},{"url":"https://www.sanjusangendo.jp/statue/senjukannon/","kind":"official_or_heritage"},{"url":"https://ja.kyoto.travel/komafuda/show.php?id=2254&lang=en","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.sanjusangendo.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":null,"official_info":{"url":"https://ja.kyoto.travel/komafuda/show.php?id=2254&lang=en","label":"公式情報"},"summary":"千手観音の大きな坐像。三十三間堂の中央を占める本尊です。","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"千手観音菩薩","families":["菩薩"],"deity_names":[{"name":"千手観音菩薩","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":112,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-113","name":"三十三間堂 千体千手観音立像","name_en":"","country":"日本","location":"京都府京都市","pose":"立像","category":"菩薩","description":"三十三間堂の千体千手観音立像は、長い堂内に並ぶ観音菩薩の群像です。文化庁の国宝指定資料では、立像群の員数は1001躯とされています。中央の坐像とは別の対象です。\n\n平安時代の創建時にさかのぼる像と、火災後に造り直された鎌倉時代の像などが含まれます。全てが一度に、同じ仏師によって制作されたわけではありません。\n\n同じ姿が反復する大きな眺めと、一体ずつ異なる顔や細部の両方が魅力です。群像を一体の大仏と混同せず、信仰と多数の彫刻がつくる空間として見ることができます。","color":"#b6bcae","sources":[{"url":"https://www.sanjusangendo.jp/","kind":"official_or_heritage"},{"url":"https://www.bunka.go.jp/koho_hodo_oshirase/hodohappyo/__icsFiles/afieldfile/2018/04/02/a1402236_01.pdf","kind":"official_or_heritage"},{"url":"https://ja.kyoto.travel/komafuda/show.php?id=2254&lang=en","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.sanjusangendo.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue_group","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"平安～室町時代（複数時期）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://www.bunka.go.jp/koho_hodo_oshirase/hodohappyo/__icsFiles/afieldfile/2018/04/02/a1402236_01.pdf"},"official_info":{"url":"https://ja.kyoto.travel/komafuda/show.php?id=2254&lang=en","label":"公式情報"},"summary":"1001体の立像からなる観音群。中央の千手観音坐像とは別に数えます。","material":"木造","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"千手観音菩薩","families":["菩薩"],"deity_names":[{"name":"千手観音菩薩","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":113,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-114","name":"広隆寺 弥勒菩薩半跏思惟像","name_en":"","country":"日本","location":"京都府京都市","pose":"半跏像","category":"菩薩","description":"広隆寺の弥勒菩薩半跏思惟像は、片足を反対の脚に載せ、手を頬に近づける思惟の姿を表した像です。京都を代表する古代の仏教彫刻として知られています。\n\n立像・坐像の二択だけでは表しきれない「半跏像」の特徴を知る作品です。尊格は弥勒菩薩で、悟りを開いた如来の像とは呼び名も意味も異なります。\n\n体の緩やかな線、指先の動き、わずかな微笑に注目できます。中宮寺の菩薩半跏像と比べると、似た姿勢の中にも頭部や手、体の表現にそれぞれの違いが見えてきます。","color":"#b6bcae","sources":[{"url":"https://ja.kyoto.travel/tourism/single01.php?category_id=7&tourism_id=284","kind":"official_or_heritage"},{"url":"https://kyoto.travel/en/destinations/koryuji-temple/","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":null,"admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"飛鳥時代","basis":"公式資料の制作年代","note":"寺院の創建や建物の再建年代と、仏像の制作年代を区別しています。","source_url":"https://ja.kyoto.travel/tourism/single01.php?category_id=7&tourism_id=284"},"official_info":{"url":"https://ja.kyoto.travel/tourism/single01.php?category_id=7&tourism_id=284","label":"自治体・観光協会の公式情報"},"summary":"片足を組み、頬に手を寄せる、広隆寺の半跏思惟像。","deity":"弥勒菩薩","families":["菩薩"],"deity_names":[{"name":"弥勒菩薩","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":114,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-115","name":"清凉寺 釈迦如来像","name_en":"","country":"日本","location":"京都府京都市","pose":"立像","category":"如来","description":"清凉寺の本尊釈迦如来像は、僧・奝然が中国から日本へもたらした像です。釈迦の生前の姿を伝える霊像として信仰され、「清凉寺式釈迦」と呼ばれる多くの模像が各地で造られました。\n\n原像は985年に中国・宋で制作されたものです。日本の寺院にある仏像でも、日本国内で造られたとは限らず、東アジアの交流の中で伝わった例として見ることができます。\n\n衣の表現や顔立ちを手掛かりに、各地の清凉寺式の像と比べられます。ただし模像の高さや年代を、清凉寺本尊の情報として混ぜないことが大切です。","color":"#b6bcae","sources":[{"url":"https://seiryoji.or.jp/","kind":"official_or_heritage"},{"url":"https://ja.kyoto.travel/tourism/single01.php?category_id=7&tourism_id=391","kind":"official_or_heritage"},{"url":"https://www.narahaku.go.jp/collection/v-887-0_0_2.html","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://seiryoji.or.jp/","admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":{"label":"985年（中国・宋で制作）","basis":"制作・建立の資料照合","note":"寺院・自治体・文化財資料の記載による。寺院の創建年とは区別しています。","source_url":"https://ja.kyoto.travel/tourism/single01.php?category_id=7&tourism_id=391"},"official_info":{"url":"https://ja.kyoto.travel/tourism/single01.php?category_id=7&tourism_id=391","label":"公式情報"},"summary":"中国から伝来し、多くの模像を生んだ清凉寺の釈迦如来。","material":"木造","official_link_label":"寺院公式サイト","official_checked_at":"2026-11-08","deity":"釈迦如来","families":["仏・如来"],"deity_names":[{"name":"釈迦如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":115,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-116","name":"蓮光寺 阿弥陀如来像","name_en":"","country":"日本","location":"京都府京都市","pose":"立像","category":"如来","description":"蓮光寺の阿弥陀如来像は、京都の寺院に伝わる仏像です。阿弥陀如来は、釈迦如来や薬師如来とは異なる仏で、極楽浄土への信仰と結び付いています。\n\n京都の観光案内では、快慶の弟子・覚明に関わる由来が紹介されています。こうした物語は像がどのように敬われてきたかを知る材料ですが、伝承をそのまま確定した作者・制作年として登録することは避けています。\n\n像を鑑賞するときは、姿そのものと、寺に伝わる物語の双方に目を向けられます。大きさの記録だけでなく、信仰や語りが仏像の魅力を形づくることを示す一例です。","color":"#b6bcae","sources":[{"url":"https://ja.kyoto.travel/tourism/single01.php?category_id=7&tourism_id=77","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":null,"admission":null,"opening_hours":null,"images":[],"record_type":"statue","verified_fields":["location","description","pose","name","sources"],"reviewed_at":"2026-11-08","creation_date":null,"official_info":{"url":"https://ja.kyoto.travel/tourism/single01.php?category_id=7&tourism_id=77","label":"公式情報"},"summary":"京都・蓮光寺の阿弥陀如来。像の来歴にまつわる伝承も読みどころ。","deity":"阿弥陀如来","families":["仏・如来"],"deity_names":[{"name":"阿弥陀如来","language":"ja"}],"traditions":[],"schools":[],"classification_note":"","revision":0,"photo_research":{"status":"unresearched","commons_file_page":null,"photo_author":null,"photo_license":null,"license_url":null,"publication_status":"not_published","rights_review":"未調査","representation_scope":"","publication_review":"未判定"},"display_order":116,"is_featured":false,"is_published":true,"image_url":""},{"id":"buddha-117","name":"メトロポリタン美術館 観音・弥勒を伴う仏三尊像","name_en":"","country":"アメリカ","location":"ニューヨーク","pose":"複数の姿","category":"美術館所蔵","description":"スマトラまたはタイ南部の作。8世紀後半の銅合金製三尊像。","color":"#b6bcae","sources":[{"url":"https://www.metmuseum.org/art/collection/search/38994","kind":"official_or_heritage"}],"height_statue_m":null,"height_total_m":null,"length_m":null,"completed_year":null,"latitude":null,"longitude":null,"official_url":"https://www.metmuseum.org/art/collection/search/38994","admission":null,"opening_hours":null,"images":[],"record_type":"collection_object","verified_fields":["name","location","pose","description"],"reviewed_at":"2026-11-08","creation_date":{"label":"8世紀後半","basis":"制作・造営年代","note":"制作年代。","source_url":"https://www.metmuseum.org/art/collection/search/38994"},"families" function csv(){const cols=['display_order','is_featured','is_published','id','name','country','location','pose','category','height_statue_m','height_total_m','length_m','material','official_url','image_url'];const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';download('daibutsu_order_list.csv','\ufeff'+cols.join(',')+'\r\n'+ordered().map(r=>cols.map(c=>quote(r[c])).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
$('rows').addEventListener('click',e=>{const act=e.target.closest('[data-action]');if(act){const id=act.dataset.id;if(act.dataset.action==='up')move(id,-1);if(act.dataset.action==='down')move(id,1);if(act.dataset.action==='pin')pin(id);return;}const row=e.target.closest('[data-id]');if(row)showEditor(row.dataset.id)});
$('rows').addEventListener('dragstart',e=>{const row=e.target.closest('.entry');dragId=row?.dataset.id||null;if(e.dataTransfer)e.dataTransfer.effectAllowed='move'});$('rows').addEventListener('dragover',e=>{if(dragId)e.preventDefault()});$('rows').addEventListener('drop',e=>{e.preventDefault();const id=e.target.closest('.entry')?.dataset.id;if(dragId&&id)dnd(dragId,id);dragId=null});$('rows').addEventListener('dragend',()=>dragId=null);
$('editor').addEventListener('click',e=>{if(e.target.id==='update')update();if(e.target.id==='remove')remove()});$('new').onclick=create;$('save').onclick=persist;$('export').onclick=exportJSON;$('csv').onclick=csv;$('import').onclick=()=>$('file').click();$('search').oninput=renderList;$('filter').onchange=renderList;$('sort').onchange=renderList;
$('file').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const data=JSON.parse(await f.text());const imported=Array.isArray(data)?data:data.records;if(!Array.isArray(imported)||!imported.every(r=>r&&typeof r.id==='string'&&typeof r.name==='string'))throw new Error('idとnameを持つrecords配列が必要です');if(new Set(imported.map(r=>r.id)).size!==imported.length)throw new Error('同じIDが複数含まれています');if(!confirm(`${imported.length}件を読み込んで、現在の一覧を置き換えますか？`))return;records=imported.map((r,i)=>({...r,is_published:r.is_published!==false,is_featured:!!r.is_featured,display_order:Number(r.display_order)||i+1}));selected=null;mark();renderList();$('editor').innerHTML='<div class="empty">取り込みました。変更を保存してください。</div>'}catch(err){alert('読み込み失敗：'+err.message)}finally{$('file').value=''}};
$('reset').onclick=()=>{if(!confirm('ブラウザ内の変更を消して、最初の265件に戻しますか？'))return;records=initial.map(x=>({...x}));selected=null;localStorage.removeItem(KEY);renderList();$('editor').innerHTML='<div class="empty">初期データに戻しました。</div>';setStatus('初期データに戻しました。')};
try{const v=localStorage.getItem(KEY);if(v){const a=JSON.parse(v);if(Array.isArray(a)&&a.length)records=a;setStatus('前回このブラウザに保存した編集内容を読み込みました。')}}catch(e){setStatus('保存データを読み込めませんでした。初期データを表示します。')}renderList();showEditor(records[0]?.id);
</script>
<style>.netlify-adminbar{position:sticky;top:0;z-index:999;background:#e9f2ec;border-bottom:2px solid #427661;padding:12px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:10px;font:14px system-ui}.netlify-adminbar input[type=password]{min-width:225px;border:1px solid #aabcae;border-radius:8px;padding:9px}.netlify-adminbar button{padding:9px 12px;border:1px solid #8ea99b;border-radius:8px;background:white;cursor:pointer}</style>
<div class="netlify-adminbar"><strong>公開サイト連動</strong><label>管理キー <input type="password" id="serverToken" autocomplete="off" placeholder="Netlify ADMIN_TOKEN"/></label><button id="serverReload" type="button">公開データを読み込み</button><button id="serverSave" type="button">公開サーバーに保存</button><input id="serverPhoto" type="file" accept="image/png,image/jpeg,image/webp" aria-label="写真を選択"/><button id="serverUpload" type="button">写真をアップロード</button><small>ブラウザ内保存とは別に公開保存が必要です。</small></div>
<script>
let serverRevision=null;
async function loadServer(){
 if(typeof dirty!=='undefined'&&dirty&&!confirm('保存していない編集を破棄して公開データを読み込みますか？')) return;
 try{
 const res=await fetch('/api/statues',{cache:'no-store'});
 if(!res.ok)throw Error('HTTP '+res.status);
 const data=await res.json();
 if(!Array.isArray(data.records))throw Error('不正なデータ');
 serverRevision=data.revision;
 records=data.records.map((r,i)=>({...r,is_published:r.is_published!==false,is_featured:!!r.is_featured,display_order:Number(r.display_order)||i+1}));
 selected=null;dirty=false;renderList();showEditor(records[0]?.id);setStatus('公開データ '+records.length+'件を読み込みました');
 }catch(e){setStatus('公開データ読み込み失敗: '+e.message);}
}
async function saveServer(){
 try{
 if(selected)update();
 if(!serverRevision)throw Error('先に「公開データを読み込み」を押してください');
 const token=document.getElementById('serverToken').value;
 if(!token)throw Error('管理キーが必要です');
 const res=await fetch('/api/statues',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token,'X-Base-Revision':serverRevision},body:JSON.stringify({schema_version:2,records})});
 const data=await res.json();
 if(!res.ok)throw Error(data.detail||data.error||'HTTP '+res.status);
 serverRevision=data.revision;persist();setStatus('公開サーバーに'+records.length+'件を保存しました');
 }catch(e){setStatus('公開保存失敗: '+e.message);}
}
async function uploadServerPhoto(){
 try{
 const file=document.getElementById('serverPhoto').files[0];
 if(!file)throw Error('ファイルを選んでください');
 const token=document.getElementById('serverToken').value;
 if(!token)throw Error('管理キーが必要です');
 if(file.size>5000000)throw Error('5MB以内の画像にしてください');
 const form=new FormData();form.append('file',file);
 const res=await fetch('/api/upload',{method:'POST',headers:{'Authorization':'Bearer '+token},body:form});
 const data=await res.json();
 if(!res.ok)throw Error(data.detail||'HTTP '+res.status);
 const image=document.querySelector('[data-field="image_url"]');
 if(!image)throw Error('カードを選び、編集画面を開いてください');
 image.value=data.url;mark();setStatus('写真をアップロードしました。「更新」→「公開サーバーに保存」を押してください');
 }catch(e){setStatus('写真アップロード失敗: '+e.message);}
}
document.getElementById('serverReload').addEventListener('click',loadServer);
document.getElementById('serverSave').addEventListener('click',saveServer);
document.getElementById('serverUpload').addEventListener('click',uploadServerPhoto);
if(location.protocol==='http:'||location.protocol==='https:') loadServer();
</script></body></html>
